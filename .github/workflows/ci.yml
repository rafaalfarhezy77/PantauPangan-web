name: PantauPangan v2.0 CI

on:
  push:
    branches:
      - pantaupangan-v02-dev
      - main
  pull_request:
    branches:
      - pantaupangan-v02-dev
      - main

jobs:
  verify:
    name: Build, Lint, Typecheck & Test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: mysql://root:@localhost:3306/pantau_pangan_v2
      BETTER_AUTH_SECRET: ci_test_secret_key_minimum_32_characters_here_12345
      API_INDONESIA_KEY: ci_mock_key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Next.js Production
        run: npm run build
